<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Assistant</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- Always show chat screen -->
  <div id="chat-screen" class="screen">
    <header>
      <strong>🤖 Assistant</strong>
      <span class="grow"></span>
      <span id="user-name" class="muted"></span>
      <button class="btn small ghost" id="new-chat">New chat</button>
      <button class="btn small ghost" id="auth-link" onclick="login(); return false;">Log in</button>
      <button class="btn small ghost" id="logout-link" onclick="logout(); return false;" style="display: none;">Log out</button>
    </header>
    <div id="chat-log"></div>
    <form id="chat-form">
      <input id="chat-input" autocomplete="off" autofocus placeholder="Type your message..." />
      <button class="btn" id="send-btn">Send</button>
    </form>
  </div>

  <!-- Auth0Client from CDN (Phase 1) -->
  <script src="https://cdn.jsdelivr.net/npm/@auth0/auth0-spa-js@2.1.1"></script>

  <!-- Pass Auth0 config to frontend -->
  <script>
    window.AUTH0_DOMAIN = "malotian-lab.auth0.com";
    window.AUTH0_CLIENT_ID = "pCsLVKSCw8ROrXqZYWA2qGYZwcREoCjJ";
    window.AUTH0_API_AUDIENCE = "https://node-ai-assistant.example.com";
  </script>

  <script src="/js/auth.js"></script>
  <script src="/js/chat.js"></script>
</body>
</html>
